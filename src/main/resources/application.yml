server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: rdas
  cache:
    caffeine:
      spec: maximumSize=500,expireAfterWrite=6h
    type: caffeine

soap:
  country-info:
    endpoint: ${SOAP_ENDPOINT:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}
    connect-timeout: 5000
    read-timeout: 10000

resilience4j:
  circuitbreaker:
    instances:
      countryInfoSoap:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      countryInfoSoap:
        timeout-duration: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: Reference Data Aggregation Service (RDAS)
    version: 1.0.0
    description: Single source of truth for country, currency, language, and geographical reference data

logging:
  level:
    com.ncba.loop: ${LOG_LEVEL:INFO}
    org.springframework.ws: WARN
